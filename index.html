<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiftOn - 헬스 루틴 & 기록</title>

    <!-- 🌙 / ☀️ 주야간 모드 CSS 변수 및 기본 스타일 -->
    <style>
      :root {
        /* 🌙 다크 모드 (기본) */
        --bg-color: #121212;
        --surface: #1e1e1e;
        --text: #ffffff;
        --sub: #aaaaaa;
        --border: #333333;
        --primary: #ff5722; 
        --input-bg: #1a1a1a;
        --btn-bg: #222222;
        --modal-overlay: rgba(0, 0, 0, 0.8);
      }

      [data-theme='light'] {
        /* ☀️ 라이트 모드 */
        --bg-color: #f3f4f6;
        --surface: #ffffff;
        --text: #1f2937;
        --sub: #6b7280;
        --border: #e5e7eb;
        --primary: #ff5722; 
        --input-bg: #f9fafb;
        --btn-bg: #e5e7eb;
        --modal-overlay: rgba(0, 0, 0, 0.4);
      }

      body {
        background-color: var(--bg-color) !important;
        color: var(--text) !important;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
    </style>
  </head>
  <body>
    <noscript>자바스크립트를 지원하는 브라우저에서 실행해주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
